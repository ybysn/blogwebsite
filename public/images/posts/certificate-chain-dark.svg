<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fb7185"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="720" height="480" fill="#020617"/>
  <rect width="720" height="480" fill="url(#grid)"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#f1f5f9">SSL/TLS 证书信任链</text>

  <!-- Browser trust store (left, rose) -->
  <rect x="40" y="60" width="200" height="100" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#fda4af">浏览器信任存储区</text>
  <text x="140" y="110" text-anchor="middle" font-size="10" fill="#64748b">Browser Trust Store</text>
  <text x="140" y="130" text-anchor="middle" font-size="9" fill="#64748b">预装数百个 Root CA 证书</text>
  <text x="140" y="148" text-anchor="middle" font-size="9" fill="#64748b">操作系统 / 浏览器内置</text>

  <!-- Arrow: browser → root CA -->
  <line x1="240" y1="110" x2="290" y2="110" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="265" y="104" text-anchor="middle" font-size="9" fill="#64748b">隐含信任</text>

  <!-- Root CA (violet) -->
  <rect x="290" y="60" width="180" height="100" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#c4b5fd">Root CA</text>
  <text x="380" y="106" text-anchor="middle" font-size="9" fill="#64748b">根证书颁发机构</text>
  <text x="380" y="124" text-anchor="middle" font-size="9" fill="#64748b">自签名 · 离线存储</text>
  <text x="380" y="146" text-anchor="middle" font-size="10" fill="#a78bfa">DigiCert / ISRG / Sectigo</text>

  <!-- Arrow: root → intermediate -->
  <line x1="380" y1="160" x2="380" y2="200" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="395" y="182" font-size="9" fill="#64748b">数字签名验证</text>

  <!-- Intermediate CA (amber) -->
  <rect x="290" y="202" width="180" height="90" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#fde68a">Intermediate CA</text>
  <text x="380" y="246" text-anchor="middle" font-size="9" fill="#64748b">中间证书颁发机构</text>
  <text x="380" y="264" text-anchor="middle" font-size="9" fill="#64748b">由 Root CA 签名</text>
  <text x="380" y="282" text-anchor="middle" font-size="9" fill="#64748b">R3 / E5 / Google Trust Services</text>

  <!-- Arrow: intermediate → server cert -->
  <line x1="380" y1="292" x2="380" y2="332" stroke="#64748b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="395" y="314" font-size="9" fill="#64748b">数字签名验证</text>

  <!-- Server cert (emerald) -->
  <rect x="290" y="334" width="180" height="90" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#6ee7b7">你的 SSL 证书</text>
  <text x="380" y="378" text-anchor="middle" font-size="9" fill="#64748b">服务器证书</text>
  <text x="380" y="396" text-anchor="middle" font-size="9" fill="#64748b">由 Intermediate CA 签名</text>
  <text x="380" y="414" text-anchor="middle" font-size="9" fill="#64748b">your-domain.com</text>

  <!-- Right side: verification result -->
  <rect x="510" y="240" width="180" height="100" rx="10" fill="#022c22" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="278" text-anchor="middle" font-size="24">🔒</text>
  <text x="600" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#6ee7b7">信任链完整</text>
  <text x="600" y="320" text-anchor="middle" font-size="9" fill="#64748b">TLS 连接已建立</text>

  <!-- Arrow from server to result -->
  <line x1="470" y1="290" x2="510" y2="290" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Error path: missing intermediate -->
  <rect x="40" y="200" width="200" height="80" rx="8" fill="#2d0a13" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="140" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#fda4af">⚠ 常见配置错误</text>
  <text x="140" y="250" text-anchor="middle" font-size="9" fill="#64748b">忘记部署中间证书</text>
  <text x="140" y="268" text-anchor="middle" font-size="9" fill="#64748b">→ 浏览器无法验证链</text>

  <!-- Red dashed connection to show error -->
  <path d="M 240 240 Q 265 240 265 245 Q 265 248 290 248" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="4,3"/>
</svg>
