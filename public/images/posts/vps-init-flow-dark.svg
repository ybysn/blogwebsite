<text x="122" y="74" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">1. SSH 登录</text>
<text x="122" y="92" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">ssh root@ip</text>
<line x1="185" y1="82" x2="195" y2="82" stroke="#34d399" stroke-width="1.5" marker-end="url(#ae)"/><rect x="195" y="55" width="125" height="55" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
<rect x="195" y="55" width="125" height="55" rx="8" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="258" y="74" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">2. 创建用户</text>
<text x="258" y="92" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">adduser + sudo 权限</text>
<line x1="320" y1="82" x2="330" y2="82" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ac)"/><rect x="330" y="55" width="125" height="55" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
<rect x="330" y="55" width="125" height="55" rx="8" fill="rgba(76,29,149,0.25)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="392" y="74" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">3. SSH 密钥</text>
<text x="392" y="92" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">禁用密码登录</text>
<line x1="455" y1="82" x2="465" y2="82" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#av)"/><rect x="465" y="55" width="125" height="55" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
<rect x="465" y="55" width="125" height="55" rx="8" fill="rgba(6,78,59,0.30)" stroke="#34d399" stroke-width="1.5"/>
<text x="528" y="74" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">4. 防火墙</text>
<text x="528" y="92" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">UFW 仅开放必要端口</text>
<line x1="590" y1="82" x2="600" y2="82" stroke="#34d399" stroke-width="1.5" marker-end="url(#ae)"/><rect x="600" y="55" width="125" height="55" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
<rect x="600" y="55" width="125" height="55" rx="8" fill="rgba(8,51,68,0.35)" stroke="#22d3ee" stroke-width="1.5"/>
