<rect width="900" height="480" fill="#020617"/>
<rect width="900" height="480" fill="url(#grid)"/>
<text x="450" y="28" fill="white" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">VPS 初始化完整流程</text>
