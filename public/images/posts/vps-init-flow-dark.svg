<text x="662" y="92" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">apt update + 自动安全更新</text>
<line x1="725" y1="82" x2="735" y2="82" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ac)"/><rect x="735" y="55" width="125" height="55" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
<rect x="735" y="55" width="125" height="55" rx="8" fill="rgba(136,19,55,0.30)" stroke="#fb7185" stroke-width="1.5"/>
