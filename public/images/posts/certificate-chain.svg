<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e11d48"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>
  <rect width="720" height="480" fill="url(#grid)"/>

  <!-- Title -->
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">SSL/TLS 证书信任链</text>

  <!-- Browser trust store (left, rose) -->
  <rect x="40" y="60" width="200" height="100" rx="10" fill="#ffffff" stroke="#e11d48" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#be123c">浏览器信任存储区</text>
  <text x="140" y="110" text-anchor="middle" font-size="10" fill="#6b7280">Browser Trust Store</text>
  <text x="140" y="130" text-anchor="middle" font-size="9" fill="#6b7280">预装数百个 Root CA 证书</text>
  <text x="140" y="148" text-anchor="middle" font-size="9" fill="#6b7280">操作系统 / 浏览器内置</text>

  <!-- Arrow: browser → root CA -->
  <line x1="240" y1="110" x2="290" y2="110" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="265" y="104" text-anchor="middle" font-size="9" fill="#6b7280">隐含信任</text>

  <!-- Root CA (violet) -->
  <rect x="290" y="60" width="180" height="100" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">Root CA</text>
  <text x="380" y="106" text-anchor="middle" font-size="9" fill="#6b7280">根证书颁发机构</text>
  <text x="380" y="124" text-anchor="middle" font-size="9" fill="#6b7280">自签名 · 离线存储</text>
  <text x="380" y="146" text-anchor="middle" font-size="10" fill="#7c3aed">DigiCert / ISRG / Sectigo</text>

  <!-- Arrow: root → intermediate -->
  <line x1="380" y1="160" x2="380" y2="200" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="395" y="182" font-size="9" fill="#6b7280">数字签名验证</text>

  <!-- Intermediate CA (amber) -->
  <rect x="290" y="202" width="180" height="90" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Intermediate CA</text>
  <text x="380" y="246" text-anchor="middle" font-size="9" fill="#6b7280">中间证书颁发机构</text>
  <text x="380" y="264" text-anchor="middle" font-size="9" fill="#6b7280">由 Root CA 签名</text>
  <text x="380" y="282" text-anchor="middle" font-size="9" fill="#6b7280">R3 / E5 / Google Trust Services</text>

  <!-- Arrow: intermediate → server cert -->
  <line x1="380" y1="292" x2="380" y2="332" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="395" y="314" font-size="9" fill="#6b7280">数字签名验证</text>

  <!-- Server cert (emerald) -->
  <rect x="290" y="334" width="180" height="90" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">你的 SSL 证书</text>
  <text x="380" y="378" text-anchor="middle" font-size="9" fill="#6b7280">服务器证书</text>
  <text x="380" y="396" text-anchor="middle" font-size="9" fill="#6b7280">由 Intermediate CA 签名</text>
  <text x="380" y="414" text-anchor="middle" font-size="9" fill="#6b7280">your-domain.com</text>

  <!-- Right side: verification result -->
  <rect x="510" y="240" width="180" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="278" text-anchor="middle" font-size="24">🔒</text>
  <text x="600" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">信任链完整</text>
  <text x="600" y="320" text-anchor="middle" font-size="9" fill="#6b7280">TLS 连接已建立</text>

  <!-- Arrow from server to result -->
  <line x1="470" y1="290" x2="510" y2="290" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Error path: missing intermediate -->
  <rect x="40" y="200" width="200" height="80" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="140" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#be123c">⚠ 常见配置错误</text>
  <text x="140" y="250" text-anchor="middle" font-size="9" fill="#6b7280">忘记部署中间证书</text>
  <text x="140" y="268" text-anchor="middle" font-size="9" fill="#6b7280">→ 浏览器无法验证链</text>

  <!-- Red dashed connection to show error -->
  <path d="M 240 240 Q 265 240 265 245 Q 265 248 290 248" fill="none" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="4,3"/>
</svg>
