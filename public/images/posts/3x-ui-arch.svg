<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="av" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="1000" height="620" fill="#fafafa"/>
  <rect width="1000" height="620" fill="url(#g)"/>
  <text x="500" y="28" fill="#111827" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">3X-UI 多协议代理架构</text>

  <!-- Clients -->
  <rect x="60" y="50" width="130" height="50" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="125" y="72" fill="#374151" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Windows</text>
  <text x="125" y="88" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">v2rayN</text>

  <rect x="260" y="50" width="130" height="50" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="325" y="72" fill="#374151" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">macOS</text>
  <text x="325" y="88" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">V2rayU</text>

  <rect x="460" y="50" width="130" height="50" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="525" y="72" fill="#374151" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">iOS</text>
  <text x="525" y="88" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Shadowrocket</text>

  <rect x="660" y="50" width="130" height="50" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="725" y="72" fill="#374151" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Android</text>
  <text x="725" y="88" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">v2rayNG</text>

  <!-- Client arrows to CDN -->
  <line x1="190" y1="75" x2="240" y2="130" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/>
  <line x1="325" y1="100" x2="325" y2="125" stroke="#9ca3af" stroke-width="1"/>
  <line x1="390" y1="75" x2="350" y2="130" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/>
  <line x1="525" y1="100" x2="525" y2="125" stroke="#9ca3af" stroke-width="1"/>
  <line x1="590" y1="75" x2="640" y2="130" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/>
  <line x1="810" y1="75" x2="800" y2="130" stroke="#9ca3af" stroke-width="1" marker-end="url(#a)"/>

  <!-- CDN -->
  <rect x="250" y="130" width="500" height="55" rx="10" fill="rgba(217,119,6,0.06)" stroke="#d97706" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="500" y="153" fill="#92400e" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">CDN 层（可选）</text>
  <text x="500" y="171" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Cloudflare / AWS CloudFront</text>

  <line x1="500" y1="185" x2="500" y2="210" stroke="#d97706" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- VPS Boundary -->
  <rect x="120" y="215" width="760" height="135" rx="12" fill="rgba(5,150,105,0.03)" stroke="#059669" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="140" y="237" fill="#065f46" font-family="monospace" font-size="12" font-weight="bold">VPS</text>

  <!-- 3X-UI Panel -->
  <rect x="200" y="248" width="240" height="65" rx="8" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="320" y="272" fill="#155e75" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">3X-UI Panel</text>
  <text x="320" y="290" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Web 管理面板 :2053</text>
  <text x="320" y="304" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">协议配置 · 流量统计 · 用户管理</text>

  <line x1="440" y1="280" x2="540" y2="280" stroke="#0891b2" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Xray Core -->
  <rect x="548" y="248" width="260" height="65" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="678" y="272" fill="#065f46" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Xray Core</text>
  <text x="678" y="290" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">入站 / 路由 / 出站</text>
  <text x="678" y="304" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">TLS · Reality · CDN 兼容</text>

  <line x1="500" y1="350" x2="500" y2="380" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Protocols -->
  <rect x="60" y="385" width="145" height="55" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="132" y="409" fill="#5b21b6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">VLESS</text>
  <text x="132" y="427" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">+ XTLS / Reality</text>

  <rect x="235" y="385" width="145" height="55" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="307" y="409" fill="#5b21b6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">VMess</text>
  <text x="307" y="427" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">+ WebSocket / TLS</text>

  <rect x="410" y="385" width="145" height="55" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="482" y="409" fill="#5b21b6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Shadowsocks</text>
  <text x="482" y="427" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">2022-blake3</text>

  <rect x="585" y="385" width="145" height="55" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="657" y="409" fill="#5b21b6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Trojan</text>
  <text x="657" y="427" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">+ WebSocket / TLS</text>

  <rect x="760" y="385" width="145" height="55" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="832" y="409" fill="#5b21b6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Reality</text>
  <text x="832" y="427" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">偷取目标 TLS</text>

  <!-- Protocol arrows to Internet -->
  <line x1="132" y1="440" x2="132" y2="470" stroke="#7c3aed" stroke-width="1" marker-end="url(#av)"/>
  <line x1="307" y1="440" x2="307" y2="470" stroke="#7c3aed" stroke-width="1" marker-end="url(#av)"/>
  <line x1="482" y1="440" x2="482" y2="470" stroke="#7c3aed" stroke-width="1" marker-end="url(#av)"/>
  <line x1="657" y1="440" x2="657" y2="470" stroke="#7c3aed" stroke-width="1" marker-end="url(#av)"/>
  <line x1="832" y1="440" x2="832" y2="470" stroke="#7c3aed" stroke-width="1" marker-end="url(#av)"/>

  <!-- Internet -->
  <rect x="200" y="475" width="600" height="50" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="500" y="500" fill="#374151" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Internet / 目标服务器</text>
  <text x="500" y="516" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">经 Xray 出站 → 加密隧道 → 访问目标</text>

  <!-- Legend -->
  <rect x="40" y="545" width="920" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <rect x="70" y="560" width="18" height="12" rx="3" fill="white" stroke="#9ca3af" stroke-width="1"/><text x="94" y="571" fill="#374151" font-family="monospace" font-size="10">客户端</text>
  <rect x="170" y="560" width="18" height="12" rx="3" fill="rgba(217,119,6,0.06)" stroke="#d97706" stroke-width="1" stroke-dasharray="6,3"/><text x="194" y="571" fill="#374151" font-family="monospace" font-size="10">CDN 层</text>
  <rect x="270" y="560" width="18" height="12" rx="3" fill="white" stroke="#0891b2" stroke-width="1"/><text x="294" y="571" fill="#374151" font-family="monospace" font-size="10">管理面板</text>
  <rect x="390" y="560" width="18" height="12" rx="3" fill="white" stroke="#059669" stroke-width="1"/><text x="414" y="571" fill="#374151" font-family="monospace" font-size="10">Xray 核心</text>
  <rect x="510" y="560" width="18" height="12" rx="3" fill="white" stroke="#7c3aed" stroke-width="1"/><text x="534" y="571" fill="#374151" font-family="monospace" font-size="10">代理协议</text>
  <rect x="630" y="560" width="18" height="12" rx="3" fill="white" stroke="#9ca3af" stroke-width="1"/><text x="654" y="571" fill="#374151" font-family="monospace" font-size="10">目标</text>
  <line x1="750" y1="566" x2="770" y2="566" stroke="#059669" stroke-width="1" stroke-dasharray="6,3"/><text x="776" y="571" fill="#374151" font-family="monospace" font-size="10">VPS 边界</text>
</svg>
