<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="900" height="540" fill="#fafafa"/><rect width="900" height="540" fill="url(#g)"/>
  <text x="450" y="28" fill="#111827" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">Vaultwarden 自建密码管理器架构</text>

  <!-- User -->
  <rect x="60" y="50" width="160" height="55" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="140" y="72" fill="#374151" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">用户</text>
  <text x="140" y="90" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Bitwarden 客户端</text>

  <line x1="220" y1="77" x2="290" y2="77" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Nginx -->
  <rect x="300" y="50" width="200" height="55" rx="8" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="400" y="72" fill="#155e75" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Nginx 反向代理</text>
  <text x="400" y="90" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">HTTPS · Let's Encrypt</text>

  <line x1="500" y1="77" x2="570" y2="77" stroke="#0891b2" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Docker Boundary -->
  <rect x="240" y="130" width="480" height="170" rx="12" fill="rgba(5,150,105,0.03)" stroke="#059669" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="260" y="152" fill="#065f46" font-family="monospace" font-size="12" font-weight="bold">Docker 容器</text>

  <!-- Vaultwarden -->
  <rect x="280" y="165" width="200" height="70" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="380" y="190" fill="#065f46" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Vaultwarden</text>
  <text x="380" y="208" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">:8443 (Rust 实现)</text>
  <text x="380" y="224" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">密码库 · 密钥管理 · 自动填充</text>

  <line x1="480" y1="200" x2="540" y2="200" stroke="#059669" stroke-width="1.5"/>

  <!-- SQLite -->
  <rect x="548" y="175" width="140" height="50" rx="8" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="618" y="197" fill="#92400e" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SQLite</text>
  <text x="618" y="214" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">加密数据库</text>

  <!-- SMTP -->
  <rect x="280" y="250" width="200" height="35" rx="6" fill="white" stroke="#7c3aed" stroke-width="1"/>
  <text x="380" y="272" fill="#5b21b6" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SMTP 邮件通知</text>

  <!-- CRON -->
  <rect x="548" y="250" width="140" height="35" rx="6" fill="white" stroke="#e11d48" stroke-width="1"/>
  <text x="618" y="272" fill="#be123c" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">自动备份 Cron</text>

  <!-- R2 Backup -->
  <line x1="618" y1="285" x2="618" y2="320" stroke="#e11d48" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#ar)"/>

  <rect x="530" y="325" width="180" height="45" rx="8" fill="white" stroke="#e11d48" stroke-width="1.5"/>
  <text x="620" y="347" fill="#be123c" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">R2 云备份</text>
  <text x="620" y="361" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">每日 3:00 自动同步</text>

  <!-- Legend -->
  <rect x="40" y="400" width="820" height="55" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <rect x="70" y="415" width="18" height="12" rx="3" fill="white" stroke="#9ca3af" stroke-width="1"/><text x="94" y="427" fill="#374151" font-family="monospace" font-size="10">用户</text>
  <rect x="160" y="415" width="18" height="12" rx="3" fill="white" stroke="#0891b2" stroke-width="1"/><text x="184" y="427" fill="#374151" font-family="monospace" font-size="10">Nginx</text>
  <rect x="260" y="415" width="18" height="12" rx="3" fill="rgba(5,150,105,0.03)" stroke="#059669" stroke-width="1" stroke-dasharray="6,3"/><text x="284" y="427" fill="#374151" font-family="monospace" font-size="10">Docker</text>
  <rect x="370" y="415" width="18" height="12" rx="3" fill="white" stroke="#059669" stroke-width="1"/><text x="394" y="427" fill="#374151" font-family="monospace" font-size="10">Vaultwarden</text>
  <rect x="510" y="415" width="18" height="12" rx="3" fill="white" stroke="#d97706" stroke-width="1"/><text x="534" y="427" fill="#374151" font-family="monospace" font-size="10">SQLite</text>
  <rect x="620" y="415" width="18" height="12" rx="3" fill="white" stroke="#7c3aed" stroke-width="1"/><text x="644" y="427" fill="#374151" font-family="monospace" font-size="10">SMTP</text>
  <line x1="730" y1="421" x2="750" y2="421" stroke="#e11d48" stroke-width="1" stroke-dasharray="5,3"/><text x="756" y="427" fill="#374151" font-family="monospace" font-size="10">备份</text>

  <text x="450" y="465" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">核心原则：所有数据加密存储、HTTPS 传输、每日自动备份到 R2</text>
</svg>
