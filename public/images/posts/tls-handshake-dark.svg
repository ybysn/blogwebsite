<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660">
  <defs>
    <marker id="arrow-right" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="860" height="660" fill="#020617"/>
  <rect width="860" height="660" fill="url(#grid)"/>
  <text x="430" y="34" fill="white" font-family="monospace" font-size="17" font-weight="bold" text-anchor="middle">TLS 1.3 握手过程</text>
  <text x="430" y="53" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">1-RTT 完成 · 50-150ms · 之后所有数据加密传输</text>
  <text x="26" y="110" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">STEP 1</text>
  <text x="26" y="200" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">STEP 2</text>
  <text x="26" y="290" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">STEP 3</text>
  <text x="26" y="380" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">STEP 4</text>
  <text x="26" y="470" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">STEP 5</text>
  <rect x="80" y="72" width="190" height="570" rx="10" fill="rgba(34, 211, 238, 0.03)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="95" y="82" width="160" height="45" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="175" y="102" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Client</text>
  <text x="175" y="118" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Browser / curl / App</text>
  <rect x="590" y="72" width="190" height="570" rx="10" fill="rgba(52, 211, 153, 0.03)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="605" y="82" width="160" height="45" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="685" y="102" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Server</text>
  <text x="685" y="118" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">nginx / Apache / Go</text>
  <rect x="290" y="100" width="280" height="55" rx="6" fill="rgba(34, 211, 238, 0.08)" stroke="#22d3ee" stroke-width="1"/>
  <line x1="255" y1="127" x2="568" y2="127" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-right)"/>
  <text x="430" y="122" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Client Hello</text>
  <text x="430" y="138" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">TLS 版本 · 密码套件 · 随机数</text>
  <rect x="290" y="190" width="280" height="65" rx="6" fill="rgba(52, 211, 153, 0.08)" stroke="#34d399" stroke-width="1"/>
  <line x1="570" y1="222" x2="257" y2="222" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  <text x="430" y="217" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Server Hello + Certificate</text>
  <text x="430" y="233" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">选定 TLS 版本 · 密码套件 · 随机数</text>
  <text x="430" y="248" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">SSL 证书（包含公钥）</text>
  <rect x="100" y="280" width="160" height="65" rx="6" fill="rgba(251, 191, 36, 0.08)" stroke="#fbbf24" stroke-width="1"/>
  <text x="180" y="300" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">证书验证</text>
  <text x="180" y="316" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">✓ 可信 CA?  ✓ 域名匹配?</text>
  <text x="180" y="332" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">✓ 未过期?  ✓ 未吊销?</text>
  <rect x="290" y="370" width="280" height="65" rx="6" fill="rgba(171, 143, 250, 0.08)" stroke="#a78bfa" stroke-width="1"/>
  <line x1="255" y1="402" x2="568" y2="402" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#arrow-right)"/>
  <text x="430" y="397" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Key Exchange (ECDHE)</text>
  <text x="430" y="413" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Diffie-Hellman 密钥协商</text>
  <text x="430" y="428" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">证书公钥仅用于身份验证，不用于加密</text>
  <rect x="290" y="470" width="280" height="110" rx="8" fill="rgba(52, 211, 153, 0.12)" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="495" fill="#34d399" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">&#x1F512;</text>
  <text x="430" y="518" fill="white" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">对称加密通信</text>
  <line x1="310" y1="528" x2="550" y2="528" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="430" y="545" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">AES-GCM / ChaCha20-Poly1305</text>
  <text x="430" y="563" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">双向加密 · 所有 HTTP 请求 / 响应</text>
  <line x1="310" y1="535" x2="290" y2="535" stroke="#34d399" stroke-width="1.2"/>
  <text x="290" y="531" fill="#64748b" font-family="monospace" font-size="8" text-anchor="end">GET</text>
  <text x="570" y="531" fill="#64748b" font-family="monospace" font-size="8" text-anchor="start">HTML</text>
  <rect x="80" y="600" width="700" height="48" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="#1e293b" stroke-width="1"/>
  <text x="430" y="618" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle"><tspan fill="#fbbf24" font-weight="bold">TLS 1.3</tspan>  |  1-RTT 完成握手</text>
  <text x="430" y="637" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">50-150ms 握手耗时  ·  证书仅用于身份验证 (非密钥交换)  ·  perfect forward secrecy</text>
</svg>