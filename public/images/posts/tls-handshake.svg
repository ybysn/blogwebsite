<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660">
  <defs>
    <marker id="arrow-right" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-left" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#0891b2"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="660" fill="#fafafa"/>
  <rect width="860" height="660" fill="url(#grid)"/>

  <!-- Title -->
  <text x="430" y="34" fill="#111827" font-family="monospace" font-size="17" font-weight="bold" text-anchor="middle">TLS 1.3 握手过程</text>
  <text x="430" y="53" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">1-RTT 完成 · 50-150ms · 之后所有数据加密传输</text>

  <!-- Step labels on left -->
  <text x="26" y="110" fill="#d97706" font-family="monospace" font-size="12" font-weight="bold">STEP 1</text>
  <text x="26" y="200" fill="#d97706" font-family="monospace" font-size="12" font-weight="bold">STEP 2</text>
  <text x="26" y="290" fill="#d97706" font-family="monospace" font-size="12" font-weight="bold">STEP 3</text>
  <text x="26" y="380" fill="#d97706" font-family="monospace" font-size="12" font-weight="bold">STEP 4</text>
  <text x="26" y="470" fill="#d97706" font-family="monospace" font-size="12" font-weight="bold">STEP 5</text>

  <!-- CLIENT COLUMN -->
  <rect x="80" y="72" width="190" height="570" rx="10" fill="rgba(8, 145, 178, 0.04)" stroke="#0891b2" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="95" y="82" width="160" height="45" rx="8" fill="white" stroke="#0891b2" stroke-width="1.5"/>
  <text x="175" y="102" fill="#155e75" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Client</text>
  <text x="175" y="118" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">Browser / curl / App</text>

  <!-- SERVER COLUMN -->
  <rect x="590" y="72" width="190" height="570" rx="10" fill="rgba(5, 150, 105, 0.04)" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="605" y="82" width="160" height="45" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="685" y="102" fill="#065f46" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Server</text>
  <text x="685" y="118" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">nginx / Apache / Go</text>

  <!-- ARROW 1: Client Hello -->
  <rect x="290" y="100" width="280" height="55" rx="6" fill="rgba(8, 145, 178, 0.06)" stroke="#0891b2" stroke-width="1"/>
  <line x1="255" y1="127" x2="568" y2="127" stroke="#0891b2" stroke-width="2.2" marker-end="url(#arrow-right)"/>
  <text x="430" y="122" fill="#0891b2" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Client Hello</text>
  <text x="430" y="138" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">TLS 版本 · 密码套件 · 随机数</text>

  <!-- ARROW 2: Server Hello -->
  <rect x="290" y="190" width="280" height="65" rx="6" fill="rgba(5, 150, 105, 0.06)" stroke="#059669" stroke-width="1"/>
  <line x1="570" y1="222" x2="257" y2="222" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  <text x="430" y="217" fill="#059669" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Server Hello + Certificate</text>
  <text x="430" y="233" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">选定 TLS 版本 · 密码套件 · 随机数</text>
  <text x="430" y="248" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">SSL 证书（包含公钥）</text>

  <!-- ARROW 3: Certificate Verification -->
  <rect x="100" y="280" width="160" height="65" rx="6" fill="rgba(217, 119, 6, 0.06)" stroke="#d97706" stroke-width="1"/>
  <text x="180" y="300" fill="#d97706" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">证书验证</text>
  <text x="180" y="316" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">✓ 可信 CA?  ✓ 域名匹配?</text>
  <text x="180" y="332" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">✓ 未过期?  ✓ 未吊销?</text>

  <!-- ARROW 4: Key Exchange -->
  <rect x="290" y="370" width="280" height="65" rx="6" fill="rgba(124, 58, 237, 0.06)" stroke="#7c3aed" stroke-width="1"/>
  <line x1="255" y1="402" x2="568" y2="402" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-right)"/>
  <text x="430" y="397" fill="#7c3aed" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Key Exchange (ECDHE)</text>
  <text x="430" y="413" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">Diffie-Hellman 密钥协商</text>
  <text x="430" y="428" fill="#9ca3af" font-family="monospace" font-size="8" text-anchor="middle">证书公钥仅用于身份验证，不用于加密</text>

  <!-- ARROW 5: Encrypted Connection -->
  <rect x="290" y="470" width="280" height="110" rx="8" fill="rgba(5, 150, 105, 0.08)" stroke="#059669" stroke-width="1.5"/>
  <text x="430" y="495" fill="#059669" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">&#x1F512;</text>
  <text x="430" y="518" fill="#111827" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">对称加密通信</text>
  <line x1="310" y1="528" x2="550" y2="528" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="430" y="545" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">AES-GCM / ChaCha20-Poly1305</text>
  <text x="430" y="563" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">双向加密 · 所有 HTTP 请求 / 响应</text>

  <line x1="310" y1="535" x2="290" y2="535" stroke="#059669" stroke-width="1.2"/>
  <text x="290" y="531" fill="#9ca3af" font-family="monospace" font-size="8" text-anchor="end">GET</text>
  <text x="570" y="531" fill="#9ca3af" font-family="monospace" font-size="8" text-anchor="start">HTML</text>

  <!-- BOTTOM SUMMARY -->
  <rect x="80" y="600" width="700" height="48" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="430" y="618" fill="#374151" font-family="monospace" font-size="10" text-anchor="middle">
    <tspan fill="#d97706" font-weight="bold">TLS 1.3</tspan>  |  1-RTT 完成握手
  </text>
  <text x="430" y="637" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">
    50-150ms 握手耗时  ·  证书仅用于身份验证 (非密钥交换)  ·  perfect forward secrecy
  </text>
</svg>