<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg-grad)"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="34" fill="white" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">Cloudflare Tunnel + Vaultwarden 内网穿透架构</text>
  <text x="450" y="52" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">无需公网 IP · 自动 SSL · 零配置端口转发</text>

  <!-- ============================================================ -->
  <!-- PUBLIC INTERNET -->
  <!-- ============================================================ -->
  <rect x="20" y="70" width="400" height="390" rx="14" fill="rgba(148, 163, 184, 0.03)" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="34" y="90" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">公网</text>

  <!-- User -->
  <rect x="50" y="110" width="120" height="55" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="50" y="110" width="120" height="55" rx="8" fill="rgba(30, 41, 59, 0.4)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="110" y="134" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">User</text>
  <text x="110" y="150" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Bitwarden Client</text>
  <text x="110" y="162" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">Browser / Mobile</text>

  <!-- Cloudflare Edge -->
  <rect x="210" y="110" width="180" height="55" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="210" y="110" width="180" height="55" rx="8" fill="rgba(120, 53, 15, 0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="133" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Cloudflare Edge</text>
  <text x="300" y="149" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">DDoS Protection · WAF</text>
  <text x="300" y="161" fill="#fbbf24" font-family="monospace" font-size="8" text-anchor="middle">vault.example.com</text>

  <!-- ============================================================ -->
  <!-- PRIVATE NETWORK -->
  <!-- ============================================================ -->
  <rect x="470" y="70" width="410" height="390" rx="14" fill="rgba(34, 211, 238, 0.03)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="484" y="90" fill="#22d3ee" font-family="monospace" font-size="11" font-weight="bold">内网 (WSL)</text>

  <!-- cloudflared daemon -->
  <rect x="500" y="110" width="160" height="65" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="500" y="110" width="160" height="65" rx="8" fill="rgba(76, 29, 149, 0.25)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="580" y="134" fill="white" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">cloudflared</text>
  <text x="580" y="150" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Tunnel Daemon</text>
  <text x="580" y="166" fill="#a78bfa" font-family="monospace" font-size="8" text-anchor="middle">--token $TUNNEL_TOKEN</text>

  <!-- Docker -->
  <rect x="500" y="210" width="340" height="230" rx="12" fill="rgba(6, 78, 59, 0.04)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="514" y="230" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">Docker Engine</text>

  <!-- Vaultwarden -->
  <rect x="530" y="250" width="180" height="80" rx="8" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
  <rect x="530" y="250" width="180" height="80" rx="8" fill="rgba(136, 19, 55, 0.25)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="620" y="278" fill="white" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Vaultwarden</text>
  <text x="620" y="296" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Bitwarden Compatible</text>
  <text x="620" y="314" fill="#fb7185" font-family="monospace" font-size="9" text-anchor="middle">port 8443:80</text>
  <text x="620" y="326" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">restart: unless-stopped</text>

  <!-- Persistent Volume -->
  <rect x="740" y="350" width="80" height="55" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="740" y="350" width="80" height="55" rx="8" fill="rgba(120, 53, 15, 0.20)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="780" y="375" fill="white" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">/data</text>
  <text x="780" y="392" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Persist</text>

  <!-- ARROWS --------------------------------------------------------- -->

  <!-- User → Cloudflare Edge -->
  <line x1="170" y1="137" x2="208" y2="137" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="189" y="131" fill="#94a3b8" font-family="monospace" font-size="8">TLS</text>

  <!-- Cloudflare Edge → cloudflared (Tunnel) -->
  <line x1="390" y1="137" x2="498" y2="137" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="444" y="131" fill="#a78bfa" font-family="monospace" font-size="9">Tunnel QUIC</text>

  <!-- cloudflared → Vaultwarden -->
  <line x1="580" y1="175" x2="580" y2="248" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow-rose)"/>
  <text x="594" y="218" fill="#94a3b8" font-family="monospace" font-size="9">:8443</text>

  <!-- Vaultwarden → Volume -->
  <path d="M 710 295 L 730 295 L 730 370 L 738 370" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="724" y="285" fill="#94a3b8" font-family="monospace" font-size="8">sqlite</text>

  <!-- Vaultwarden ← → Volume (read) -->
  <path d="M 740 380 L 720 380 L 720 300 L 712 300" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ============================================================ -->
  <!-- BOTTOM: Backup Pipeline -->
  <!-- ============================================================ -->
  <rect x="360" y="370" width="110" height="50" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <rect x="360" y="370" width="110" height="50" rx="8" fill="rgba(6, 78, 59, 0.25)" stroke="#34d399" stroke-width="1.5"/>
  <text x="415" y="393" fill="white" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Cron Timer</text>
  <text x="415" y="410" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">每天 03:00</text>

  <!-- R2 -->
  <rect x="360" y="445" width="110" height="40" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="360" y="445" width="110" height="40" rx="8" fill="rgba(120, 53, 15, 0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="415" y="463" fill="white" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Cloudflare R2</text>
  <text x="415" y="478" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">远程备份</text>

  <!-- Backup → R2 -->
  <line x1="415" y1="420" x2="415" y2="443" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Volume → Backup -->
  <path d="M 780 405 L 780 420 L 415 420" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="600" y="416" fill="#94a3b8" font-family="monospace" font-size="8">备份脚本</text>

  <!-- Label boxes -->
  <rect x="530" y="250" width="280" height="80" rx="8" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="536" y="242" fill="#22d3ee" font-family="monospace" font-size="9">vaultwarden/server:latest</text>

  <!-- ============================================================ -->
  <!-- CONFIG BOX -->
  <!-- ============================================================ -->
  <rect x="50" y="370" width="280" height="115" rx="10" fill="rgba(30, 41, 59, 0.5)" stroke="#1e293b" stroke-width="1"/>
  <text x="190" y="392" fill="white" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">安全加固</text>

  <circle cx="72" cy="410" r="3" fill="#34d399"/>
  <text x="82" y="414" fill="#94a3b8" font-family="monospace" font-size="10">SIGNUPS_ALLOWED=false</text>

  <circle cx="72" cy="428" r="3" fill="#34d399"/>
  <text x="82" y="432" fill="#94a3b8" font-family="monospace" font-size="10">ADMIN_TOKEN 按需启用</text>

  <circle cx="72" cy="446" r="3" fill="#34d399"/>
  <text x="82" y="450" fill="#94a3b8" font-family="monospace" font-size="10">SMTP 邮件通知 (Gmail)</text>

  <circle cx="72" cy="464" r="3" fill="#34d399"/>
  <text x="82" y="468" fill="#94a3b8" font-family="monospace" font-size="10">邀请制注册 + 2FA</text>
</svg>