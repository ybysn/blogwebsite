<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="500" fill="#fafafa"/>
  <rect width="900" height="500" fill="url(#grid)"/>

  <text x="450" y="34" fill="#111827" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">Cloudflare Tunnel + Vaultwarden 内网穿透</text>
  <text x="450" y="52" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">无需公网 IP · 自动 SSL · 零配置端口转发</text>

  <!-- PUBLIC INTERNET -->
  <rect x="20" y="70" width="400" height="390" rx="14" fill="rgba(156, 163, 175, 0.05)" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="34" y="90" fill="#9ca3af" font-family="monospace" font-size="11" font-weight="bold">公网</text>

  <!-- User -->
  <rect x="50" y="110" width="120" height="55" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="110" y="134" fill="#374151" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">User</text>
  <text x="110" y="150" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Bitwarden Client</text>
  <text x="110" y="162" fill="#6b7280" font-family="monospace" font-size="8" text-anchor="middle">Browser / Mobile</text>

  <!-- Cloudflare Edge -->
  <rect x="210" y="110" width="180" height="55" rx="8" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="300" y="133" fill="#92400e" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Cloudflare Edge</text>
  <text x="300" y="149" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">DDoS Protection · WAF</text>
  <text x="300" y="161" fill="#d97706" font-family="monospace" font-size="8" text-anchor="middle">vault.example.com</text>

  <!-- PRIVATE NETWORK (WSL) -->
  <rect x="470" y="70" width="410" height="390" rx="14" fill="rgba(8, 145, 178, 0.04)" stroke="#0891b2" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="484" y="90" fill="#0891b2" font-family="monospace" font-size="11" font-weight="bold">内网 (WSL)</text>

  <!-- cloudflared -->
  <rect x="500" y="110" width="160" height="65" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="580" y="134" fill="#5b21b6" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">cloudflared</text>
  <text x="580" y="150" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Tunnel Daemon</text>
  <text x="580" y="166" fill="#7c3aed" font-family="monospace" font-size="8" text-anchor="middle">--token $TUNNEL_TOKEN</text>

  <!-- Docker Engine -->
  <rect x="500" y="210" width="340" height="230" rx="12" fill="rgba(5, 150, 105, 0.04)" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="514" y="230" fill="#059669" font-family="monospace" font-size="10" font-weight="bold">Docker Engine</text>

  <!-- Vaultwarden -->
  <rect x="530" y="250" width="180" height="80" rx="8" fill="white" stroke="#e11d48" stroke-width="1.5"/>
  <text x="620" y="278" fill="#be123c" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Vaultwarden</text>
  <text x="620" y="296" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Bitwarden Compatible</text>
  <text x="620" y="314" fill="#e11d48" font-family="monospace" font-size="9" text-anchor="middle">port 8443:80</text>
  <text x="620" y="326" fill="#9ca3af" font-family="monospace" font-size="8" text-anchor="middle">restart: unless-stopped</text>

  <!-- Volume -->
  <rect x="740" y="350" width="80" height="55" rx="8" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="780" y="375" fill="#92400e" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">/data</text>
  <text x="780" y="392" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">Persist</text>

  <!-- ARROWS -->
  <line x1="170" y1="137" x2="208" y2="137" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="189" y="131" fill="#6b7280" font-family="monospace" font-size="8">TLS</text>

  <line x1="390" y1="137" x2="498" y2="137" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="444" y="131" fill="#7c3aed" font-family="monospace" font-size="9">Tunnel QUIC</text>

  <line x1="580" y1="175" x2="580" y2="248" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arrow-rose)"/>
  <text x="594" y="218" fill="#6b7280" font-family="monospace" font-size="9">:8443</text>

  <path d="M 710 295 L 730 295 L 730 370 L 738 370" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="724" y="285" fill="#6b7280" font-family="monospace" font-size="8">sqlite</text>

  <path d="M 740 380 L 720 380 L 720 300 L 712 300" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Backup Pipeline -->
  <rect x="360" y="370" width="110" height="50" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="415" y="393" fill="#065f46" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Cron Timer</text>
  <text x="415" y="410" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">每天 03:00</text>

  <rect x="360" y="445" width="110" height="40" rx="8" fill="white" stroke="#d97706" stroke-width="1.5"/>
  <text x="415" y="463" fill="#92400e" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Cloudflare R2</text>
  <text x="415" y="478" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">远程备份</text>

  <line x1="415" y1="420" x2="415" y2="443" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <path d="M 780 405 L 780 420 L 415 420" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="600" y="416" fill="#6b7280" font-family="monospace" font-size="8">备份脚本</text>

  <rect x="530" y="250" width="280" height="80" rx="8" fill="none" stroke="#0891b2" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="536" y="242" fill="#0891b2" font-family="monospace" font-size="9">vaultwarden/server:latest</text>

  <!-- CONFIG BOX -->
  <rect x="50" y="370" width="280" height="115" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="190" y="392" fill="#111827" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">安全加固</text>

  <circle cx="72" cy="410" r="3" fill="#059669"/>
  <text x="82" y="414" fill="#374151" font-family="monospace" font-size="10">SIGNUPS_ALLOWED=false</text>

  <circle cx="72" cy="428" r="3" fill="#059669"/>
  <text x="82" y="432" fill="#374151" font-family="monospace" font-size="10">ADMIN_TOKEN 按需启用</text>

  <circle cx="72" cy="446" r="3" fill="#059669"/>
  <text x="82" y="450" fill="#374151" font-family="monospace" font-size="10">SMTP 邮件通知 (Gmail)</text>

  <circle cx="72" cy="464" r="3" fill="#059669"/>
  <text x="82" y="468" fill="#374151" font-family="monospace" font-size="10">邀请制注册 + 2FA</text>
</svg>