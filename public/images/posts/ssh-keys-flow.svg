<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="0.5"/></pattern>
<marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/></marker>
<marker id="ae" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
<marker id="av" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker></defs>
<rect width="800" height="420" fill="#fafafa"/>
<rect width="800" height="420" fill="url(#grid)"/>
<text x="400" y="28" fill="#111827" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">SSH 密钥免密登录流程</text>
<rect x="40" y="50" width="330" height="170" rx="12" fill="rgba(0,0,0,0.02)" stroke="#7c3aed" stroke-width="1" stroke-dasharray="6,3"/>
<text x="60" y="72" fill="#5b21b6" font-family="monospace" font-size="12" font-weight="bold">本地客户端</text><rect x="80" y="80" width="250" height="30" rx="6" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
<text x="205" y="87" fill="#5b21b6" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">ssh-keygen -t ed25519</text>
<rect x="80" y="120" width="120" height="45" rx="6" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
<text x="140" y="134" fill="#5b21b6" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">私钥</text>
<text x="140" y="152" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">~/.ssh/id_ed25519</text>
<rect x="210" y="120" width="120" height="45" rx="6" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
<text x="270" y="134" fill="#5b21b6" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">公钥</text>
<text x="270" y="152" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">~/.ssh/id_ed25519.pub</text>
<line x1="330" y1="142" x2="420" y2="142" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/><rect x="430" y="50" width="330" height="170" rx="12" fill="rgba(5,150,105,0.03)" stroke="#059669" stroke-width="1" stroke-dasharray="6,3"/>
<text x="450" y="72" fill="#065f46" font-family="monospace" font-size="12" font-weight="bold">远程服务器</text><rect x="470" y="80" width="250" height="30" rx="6" fill="rgba(5,150,105,0.03)" stroke="#059669" stroke-width="1.5"/>
<text x="595" y="87" fill="#065f46" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">ssh-copy-id user@server</text>
<rect x="470" y="120" width="250" height="45" rx="6" fill="rgba(5,150,105,0.03)" stroke="#059669" stroke-width="1.5"/>
<text x="595" y="134" fill="#065f46" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">~/.ssh/authorized_keys</text>
<text x="595" y="152" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">公钥追加到此文件</text>
<rect x="530" y="175" width="130" height="35" rx="6" fill="rgba(5,150,105,0.03)" stroke="#059669" stroke-width="1.5"/>
<text x="595" y="184" fill="#065f46" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">sshd 验证通过</text>
<text x="400" y="245" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">▲ 免密连接 ▲</text><line x1="80" y1="260" x2="400" y2="260" stroke="#059669" stroke-width="1.5" marker-end="url(#ae)"/><text x="240" y="255" fill="#111827" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ssh user@server → 自动认证</text><rect x="200" y="280" width="400" height="55" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
<text x="400" y="300" fill="#374151" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">🔒 安全要点</text>
<text x="400" y="318" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">私钥永不离开本地 · 禁用密码登录 · 600 权限</text>
<text x="400" y="360" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">核心：客户端持私钥、服务器存公钥，握手时验证匹配</text><rect x="40" y="375" width="720" height="38" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
<rect x="70" y="390" width="18" height="12" rx="3" fill="white" stroke="#7c3aed" stroke-width="1"/>
<text x="94" y="402" fill="#374151" font-family="monospace" font-size="10">客户端</text>
<rect x="159" y="390" width="18" height="12" rx="3" fill="rgba(5,150,105,0.03)" stroke="#059669" stroke-width="1"/>
<text x="183" y="402" fill="#374151" font-family="monospace" font-size="10">服务器</text>

</svg>