<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e5e7eb" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="900" height="520" fill="#fafafa"/>
  <rect width="900" height="520" fill="url(#g)"/>
  <text x="450" y="28" fill="#111827" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">Hysteria2 协议架构</text>

  <!-- Client -->
  <rect x="60" y="55" width="200" height="60" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="160" y="78" fill="#374151" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">客户端</text>
  <text x="160" y="96" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">Hysteria2 Client</text>

  <line x1="260" y1="85" x2="330" y2="85" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- QUIC Boundary -->
  <rect x="175" y="38" width="430" height="225" rx="12" fill="rgba(8,145,178,0.04)" stroke="#0891b2" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="195" y="58" fill="#155e75" font-family="monospace" font-size="12" font-weight="bold">QUIC 加密隧道 (UDP)</text>

  <!-- Hysteria2 Server -->
  <rect x="340" y="80" width="220" height="70" rx="8" fill="white" stroke="#059669" stroke-width="1.5"/>
  <text x="450" y="105" fill="#065f46" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Hysteria2 Server</text>
  <text x="450" y="123" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">端口跳跃 · 带宽限制 · ACL</text>
  <text x="450" y="139" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">自签 TLS 证书</text>

  <!-- QUIC features -->
  <rect x="210" y="175" width="160" height="40" rx="6" fill="white" stroke="#0891b2" stroke-width="1"/>
  <text x="290" y="195" fill="#155e75" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">HTTP/3 伪装</text>
  <text x="290" y="208" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">伪装成普通网站流量</text>

  <rect x="390" y="175" width="180" height="40" rx="6" fill="white" stroke="#0891b2" stroke-width="1"/>
  <text x="480" y="195" fill="#155e75" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Brutal 拥塞控制</text>
  <text x="480" y="208" fill="#6b7280" font-family="monospace" font-size="9" text-anchor="middle">固定速率 · 低延迟</text>

  <line x1="450" y1="263" x2="450" y2="295" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- SOCKS5 / HTTP Proxy -->
  <rect x="310" y="300" width="280" height="50" rx="8" fill="white" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="322" fill="#5b21b6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SOCKS5 / HTTP 代理</text>
  <text x="450" y="340" fill="#6b7280" font-family="monospace" font-size="10" text-anchor="middle">本地 → 转发到 Hysteria2 出站</text>

  <line x1="450" y1="350" x2="450" y2="380" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Internet -->
  <rect x="310" y="385" width="280" height="45" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="450" y="410" fill="#374151" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Internet</text>

  <!-- Legend -->
  <rect x="40" y="450" width="820" height="55" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <rect x="70" y="465" width="18" height="12" rx="3" fill="white" stroke="#9ca3af" stroke-width="1"/><text x="94" y="477" fill="#374151" font-family="monospace" font-size="10">客户端/目标</text>
  <rect x="210" y="465" width="18" height="12" rx="3" fill="rgba(8,145,178,0.04)" stroke="#0891b2" stroke-width="1" stroke-dasharray="6,3"/><text x="234" y="477" fill="#374151" font-family="monospace" font-size="10">QUIC 隧道</text>
  <rect x="350" y="465" width="18" height="12" rx="3" fill="white" stroke="#059669" stroke-width="1"/><text x="374" y="477" fill="#374151" font-family="monospace" font-size="10">Hysteria2 服务</text>
  <rect x="510" y="465" width="18" height="12" rx="3" fill="white" stroke="#7c3aed" stroke-width="1"/><text x="534" y="477" fill="#374151" font-family="monospace" font-size="10">本地代理</text>
  <text x="670" y="477" fill="#374151" font-family="monospace" font-size="10">UDP 传输 · 抗审查 · 低延迟</text>
</svg>
