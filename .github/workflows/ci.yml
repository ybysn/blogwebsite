name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 代码质量检查 ──
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # ── 构建验证 ──
  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

      # 检查构建产物完整性
      - name: Verify build output
        run: |
          if [ ! -f out/index.html ]; then
            echo "❌ Missing index.html"
            exit 1
          fi
          echo "✅ Build output OK ($(find out -type f | wc -l) files)"

      # 上传构建产物供审查
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: build-output
          path: out/
          retention-days: 7

  # ── PR 审查摘要 ──
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate review summary
        run: |
          echo "## 📋 PR 审查摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 文件变更统计
          FILES_CHANGED=$(git diff --name-only origin/main...HEAD | wc -l)
          echo "**变更文件数**: $FILES_CHANGED" >> $GITHUB_STEP_SUMMARY

          # 新增行数
          ADDED=$(git diff --stat origin/main...HEAD | tail -1 | grep -oP '\d+(?= insertion)')
          echo "**新增行数**: ${ADDED:-0}" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          # 列出变更文件
          echo "### 变更文件" >> $GITHUB_STEP_SUMMARY
          git diff --name-only origin/main...HEAD | while read f; do
            echo "- $f" >> $GITHUB_STEP_SUMMARY
          done

      # 检查是否有内容文件变更（需要配图）
      - name: Check for content changes needing images
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD | grep '^content/' || true)
          if [ -n "$CHANGED" ]; then
            echo "### ⚠️ 内容文件变更" >> $GITHUB_STEP_SUMMARY
            echo "以下内容文件有变更，请确认是否需要配图：" >> $GITHUB_STEP_SUMMARY
            echo "$CHANGED" | while read f; do
              echo "- $f" >> $GITHUB_STEP_SUMMARY
            done
          fi
